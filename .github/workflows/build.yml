name: Build

on:
  workflow_dispatch:
    inputs:
      weights:
        description: 'Comma-separated weights to build'
        required: false
        default: thin,extralight,light,regular,medium,semibold,bold,extrabold
        type: string
      styles:
        description: 'Comma-separated styles to build'
        required: false
        default: regular,italic
        type: string
      nerd_font:
        description: 'Patch in Nerd Font icons'
        required: false
        default: false
        type: boolean
      han_priority:
        description: 'Locale providing Han + shared CJK punctuation/symbols/bopomofo glyphs (kana/hangul always come from jp/kr regardless)'
        required: false
        default: tc
        type: choice
        options:
          - tc
          - hk
          - sc
          - jp
          - kr
      fill_ratio:
        description: 'Override cjk.fill_ratio (blank = use config.json)'
        required: false
        default: ''
        type: string
      italic_angle:
        description: 'Override cjk.italic_angle in degrees (blank = use config.json)'
        required: false
        default: ''
        type: string
      jetbrains_mono_version:
        description: 'Override upstream_versions.jetbrains_mono for this run only (blank = use config.json; never affects release.yml)'
        required: false
        default: ''
        type: string
      noto_cjk_release_tag:
        description: 'Override upstream_versions.noto_cjk_release_tag for this run only (blank = use config.json)'
        required: false
        default: ''
        type: string
      maple_mono_version:
        description: 'Override upstream_versions.maple_mono for this run only (blank = use config.json)'
        required: false
        default: ''
        type: string
      nerd_fonts_version:
        description: 'Override upstream_versions.nerd_fonts for this run only (blank = use config.json)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install .

      - name: Build fonts
        run: |
          python -m scripts.build \
            --weights "${{ github.event.inputs.weights }}" \
            --styles "${{ github.event.inputs.styles }}" \
            --han-priority "${{ github.event.inputs.han_priority }}" \
            ${{ github.event.inputs.nerd_font == 'true' && '--nerd-font' || '' }} \
            ${{ github.event.inputs.fill_ratio != '' && format('--fill-ratio {0}', github.event.inputs.fill_ratio) || '' }} \
            ${{ github.event.inputs.italic_angle != '' && format('--italic-angle {0}', github.event.inputs.italic_angle) || '' }} \
            ${{ github.event.inputs.jetbrains_mono_version != '' && format('--jetbrains-mono-version {0}', github.event.inputs.jetbrains_mono_version) || '' }} \
            ${{ github.event.inputs.noto_cjk_release_tag != '' && format('--noto-cjk-release-tag {0}', github.event.inputs.noto_cjk_release_tag) || '' }} \
            ${{ github.event.inputs.maple_mono_version != '' && format('--maple-mono-version {0}', github.event.inputs.maple_mono_version) || '' }} \
            ${{ github.event.inputs.nerd_fonts_version != '' && format('--nerd-fonts-version {0}', github.event.inputs.nerd_fonts_version) || '' }}

      - name: Verify build output
        run: python -m scripts.verify_build dist/fonts/*.ttf

      - name: Upload built fonts
        uses: actions/upload-artifact@v7
        with:
          name: jetbrains-noto-maple-mono
          path: |
            dist/fonts/*.ttf
            dist/fonts/*.woff2
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
