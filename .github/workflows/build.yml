name: Build

on:
  workflow_dispatch:
    inputs:
      weights:
        description: 'Comma-separated weights to build'
        required: false
        default: thin,extralight,light,regular,medium,semibold,bold,extrabold
        type: string
      styles:
        description: 'Comma-separated styles to build'
        required: false
        default: regular,italic
        type: string
      formats:
        description: 'Comma-separated output formats (ttf, woff2)'
        required: false
        default: ttf,woff2
        type: string
      nerd_font:
        description: 'Patch in Nerd Font icons'
        required: false
        default: false
        type: boolean
      han_priority:
        description: 'Locale providing Han + shared CJK punctuation/symbols/bopomofo glyphs (kana/hangul always come from jp/kr regardless)'
        required: false
        default: tc
        type: choice
        options:
          - tc
          - hk
          - sc
          - jp
          - kr
      fill_ratio:
        description: 'Override cjk.fill_ratio as JSON, e.g. 0.88 (blank = use config.jsonc)'
        required: false
        default: ''
        type: string
      italic_angle:
        description: 'Override cjk.italic_angle as JSON, in degrees, e.g. 9.0 (blank = use config.jsonc)'
        required: false
        default: ''
        type: string
      badge_weight:
        description: 'Override tags.badge_weight as JSON, e.g. "SemiBold" or null (blank = use config.jsonc)'
        required: false
        default: ''
        type: string
      corner_radius:
        description: 'Override tags.corner_radius as JSON: "pill" or a number 0-660 (blank = use config.jsonc; null is not a valid value here -- see tags_list to disable tag ligatures entirely)'
        required: false
        default: ''
        type: string
      tags_list:
        description: 'Override tags.list as a JSON array, e.g. ["[INFO]","[WARN]"], or null to disable tag ligatures entirely (blank = use config.jsonc)'
        required: false
        default: ''
        type: string
      jetbrains_mono_version:
        description: 'Override upstream_versions.jetbrains_mono as JSON for this run only, e.g. "2.304" (blank = use config.jsonc; never affects release.yml)'
        required: false
        default: ''
        type: string
      noto_cjk_release_tag:
        description: 'Override upstream_versions.noto_cjk_release_tag as JSON for this run only, e.g. "Sans2.004" (blank = use config.jsonc)'
        required: false
        default: ''
        type: string
      nerd_fonts_version:
        description: 'Override upstream_versions.nerd_fonts as JSON for this run only, e.g. "v3.5.0" (blank = use config.jsonc)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install .

      # Every override below is a straight config.jsonc dotted-path write via
      # scripts/patch_config.py, rather than a bespoke --flag per field on
      # scripts.build -- so any config.jsonc value (including tags.list
      # arrays, or null to disable tag ligatures) works uniformly, with no
      # argparse type-conversion mismatch between "blank" and "null".
      # Inputs are passed through env vars, not inlined into the script, so
      # a value containing shell metacharacters can't inject commands.
      - name: Apply config.jsonc overrides
        env:
          FILL_RATIO: ${{ github.event.inputs.fill_ratio }}
          ITALIC_ANGLE: ${{ github.event.inputs.italic_angle }}
          BADGE_WEIGHT: ${{ github.event.inputs.badge_weight }}
          CORNER_RADIUS: ${{ github.event.inputs.corner_radius }}
          TAGS_LIST: ${{ github.event.inputs.tags_list }}
          JETBRAINS_MONO_VERSION: ${{ github.event.inputs.jetbrains_mono_version }}
          NOTO_CJK_RELEASE_TAG: ${{ github.event.inputs.noto_cjk_release_tag }}
          NERD_FONTS_VERSION: ${{ github.event.inputs.nerd_fonts_version }}
        run: |
          set -e
          SET_ARGS=()
          add_if_set() { if [ -n "$2" ]; then SET_ARGS+=(--set "$1=$2"); fi; }
          add_if_set cjk.fill_ratio "$FILL_RATIO"
          add_if_set cjk.italic_angle "$ITALIC_ANGLE"
          add_if_set tags.badge_weight "$BADGE_WEIGHT"
          add_if_set tags.corner_radius "$CORNER_RADIUS"
          add_if_set tags.list "$TAGS_LIST"
          add_if_set upstream_versions.jetbrains_mono "$JETBRAINS_MONO_VERSION"
          add_if_set upstream_versions.noto_cjk_release_tag "$NOTO_CJK_RELEASE_TAG"
          add_if_set upstream_versions.nerd_fonts "$NERD_FONTS_VERSION"
          if [ ${#SET_ARGS[@]} -gt 0 ]; then
            python -m scripts.patch_config "${SET_ARGS[@]}"
          fi

      - name: Build fonts
        env:
          WEIGHTS: ${{ github.event.inputs.weights }}
          STYLES: ${{ github.event.inputs.styles }}
          FORMATS: ${{ github.event.inputs.formats }}
          HAN_PRIORITY: ${{ github.event.inputs.han_priority }}
          NERD_FONT: ${{ github.event.inputs.nerd_font }}
        run: |
          set -e
          ARGS=(--weights "$WEIGHTS" --styles "$STYLES" --formats "$FORMATS" --han-priority "$HAN_PRIORITY")
          if [ "$NERD_FONT" = "true" ]; then ARGS+=(--nerd-font); fi
          python -m scripts.build "${ARGS[@]}"

      - name: Verify build output
        run: |
          shopt -s nullglob
          python -m scripts.verify_build dist/fonts/*.ttf dist/fonts/*.woff2

      - name: Compute artifact name
        id: prefix
        env:
          HAN_PRIORITY: ${{ github.event.inputs.han_priority }}
          NERD_FONT: ${{ github.event.inputs.nerd_font }}
        run: |
          set -e
          ARGS=(--han-priority "$HAN_PRIORITY")
          if [ "$NERD_FONT" = "true" ]; then ARGS+=(--nerd-font); fi
          echo "name=$(python -m scripts.naming "${ARGS[@]}")" >> "$GITHUB_OUTPUT"

      - name: Upload built fonts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prefix.outputs.name }}
          path: |
            dist/fonts/*.ttf
            dist/fonts/*.woff2
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
