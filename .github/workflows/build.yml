name: Build

on:
  workflow_dispatch:
    inputs:
      weights:
        description: 'Comma-separated weights to build'
        required: false
        default: regular,bold
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install .

      - name: Build fonts
        run: |
          python -m scripts.build --weights "${{ github.event.inputs.weights }}"

      - name: Upload built fonts
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-noto-maple-mono
          path: dist/fonts/*.ttf
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
