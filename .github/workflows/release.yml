name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install .

      - name: Build all weights and styles (plain, no icons)
        run: |
          python -m scripts.build \
            --weights thin,extralight,light,regular,medium,semibold,bold,extrabold \
            --styles regular,italic \
            --version "${GITHUB_REF_NAME#v}"

      - name: Build all weights and styles (NF, with Nerd Font icons)
        run: |
          python -m scripts.build \
            --weights thin,extralight,light,regular,medium,semibold,bold,extrabold \
            --styles regular,italic \
            --nerd-font \
            --version "${GITHUB_REF_NAME#v}"

      - name: Verify build output
        run: python -m scripts.verify_build dist/fonts/*.ttf

      - name: Compute release file prefixes
        id: prefix
        run: |
          echo "plain=$(python -m scripts.naming)" >> "$GITHUB_OUTPUT"
          echo "nf=$(python -m scripts.naming --nerd-font)" >> "$GITHUB_OUTPUT"

      - name: Zip fonts
        run: |
          cp OFL.txt dist/fonts/OFL.txt
          cd dist/fonts
          zip -r "../../${{ steps.prefix.outputs.plain }}.zip" "${{ steps.prefix.outputs.plain }}"-*.ttf OFL.txt
          zip -r "../../${{ steps.prefix.outputs.nf }}.zip" "${{ steps.prefix.outputs.nf }}"-*.ttf OFL.txt
          zip -r "../../${{ steps.prefix.outputs.plain }}-Woff2.zip" "${{ steps.prefix.outputs.plain }}"-*.woff2 OFL.txt
          zip -r "../../${{ steps.prefix.outputs.nf }}-Woff2.zip" "${{ steps.prefix.outputs.nf }}"-*.woff2 OFL.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.prefix.outputs.plain }}.zip
            ${{ steps.prefix.outputs.nf }}.zip
            ${{ steps.prefix.outputs.plain }}-Woff2.zip
            ${{ steps.prefix.outputs.nf }}-Woff2.zip
          generate_release_notes: true
