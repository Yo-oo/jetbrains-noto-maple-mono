name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install .

      - name: Build all weights and styles (plain, no icons)
        run: |
          python -m scripts.build \
            --weights thin,extralight,light,regular,medium,semibold,bold,extrabold \
            --styles regular,italic \
            --version "${GITHUB_REF_NAME#v}"

      - name: Build all weights and styles (NF, with Nerd Font icons)
        run: |
          python -m scripts.build \
            --weights thin,extralight,light,regular,medium,semibold,bold,extrabold \
            --styles regular,italic \
            --nerd-font \
            --version "${GITHUB_REF_NAME#v}"

      - name: Verify build output
        run: python -m scripts.verify_build dist/fonts/*.ttf

      - name: Zip fonts
        run: |
          cp OFL.txt dist/fonts/OFL.txt
          cd dist/fonts
          zip -r ../../JetBrainsNotoMapleMono.zip JetBrainsNotoMapleMono-*.ttf OFL.txt
          zip -r ../../JetBrainsNotoMapleMonoNF.zip JetBrainsNotoMapleMonoNF-*.ttf OFL.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            JetBrainsNotoMapleMono.zip
            JetBrainsNotoMapleMonoNF.zip
          generate_release_notes: true
