[project]
name = "jetbrains-noto-maple-mono"
version = "0.1.0"
description = "JetBrains Mono + Noto Sans CJK + Maple Mono's tag ligatures, fused into one monospace font"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fonttools[woff]~=4.63",
]

[dependency-groups]
dev = [
    "ruff~=0.15",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "I", # isort
]
